    <h1>Customer Registration & Order Form</h1>
    <form>
        <h3>Customer Information</h3>
        <table>
            <tr>
                <td><label for="fullname" class="Required">FullName:</label></td>
                <td><input type="text" id="fullname" name="fullname" required></td>
            </tr>
            <tr>
                <td><label for="email" class="Required">Email:</label></td>
                <td><input type="email" id="email" name="email" required></td>
            </tr>
            <tr>
                <td><label for="password" class="Required">Password:</label></td>
                <td><input type="password" id="password" name="password" required></td>
            </tr>
            <tr>
                <td><label for="phone" class="Required">phone number:</label></td>
                <td><input type="tel" id="phone" name="phone" required></td>
            </tr>
        </table>
        <h3>Order Information</h3>
        <table>
            <tr>
                <td><label for="Quantity" class="Required">Quantity:</label></td>
                <td><input type="number" id="Quantity" name="Quantity" min="1" max="10" required></td>
            </tr>
            <tr>
                <td><label for="DeliveryDate" class="Required">DeliveryDate:</label></td>
                <td><input type="date" id="DeliveryDate" name="DeliveryDate" required></td>
            </tr>
            <tr>
                <td><label for="food" class="Required">Select Food:</label></td>
                <td>
                    <select id="food" name="food" required>
                        <option value="">--Please choose an option--</option>
                        <option value="pizza">Pizza</option>
                        <option value="burger">Burger</option>
                        <option value="pasta">Pasta</option>
                        <option value="deserts">Deserts</option>
                        <option value="bevarages">Bevarages</option>
                    </select>
                </td>
                <td>
            </tr>
        </table>
        <h3> Payment Method </h3>
        <table>
            <tr>
                <td><label for="payment" class="Required">Select Payment Method:</label></td>
                <td>
                    <input type="radio" id="creditcard" name="payment" value="creditcard" required>
                    <label for="creditcard">Credit Card</label><br>
                    <input type="radio" id="Debit Card" name="payment" value="debitcard" required>
                    <label for="debitcard">Debit Card</label><br>
                    <input type="radio" id="Cash" name="payment" value="cash" required>
                    <label for="cash">Cash on Delivery</label><br>
                </td>
            </tr>
        </table>
        <h3> Extras> </h3>
        <table>
            <tr>
                <td><label for="extras">Select Extras:</label></td>
                <td>
                    <input type="checkbox" id="cheese" name="extras" value="cheese">
                    <label for="cheese">Extra Cheese</label><br>
                    <input type="checkbox" id="sauce" name="extras" value="sauce">
                    <label for="sauce">Extra Sauce</label><br>
                    <input type="checkbox" id="toppings" name="extras" value="toppings">
                    <label for="toppings">Extra Toppings</label><br>
                </td>
            </tr>
        </table>
        <h3>Delivery Instructions</h3>
        <table>
            <tr>
                <td><label for="delivery">Delivery Instructions:</label></td>
                <td><textarea id="delivery" name="delivery" rows="4" cols="50" required></textarea></td>
            </tr>
            <tr>
                <td><input type="submit" value="Submit order"></td>
                <td><input type="reset" value="Reset Form"></td> 
            </tr>
        </table>
    </form>
